# docker-compose.yml
# API: Rust (api_rust) reemplaza Django (api).
# Django se mantiene SOLO para migraciones (migrator) y beat scheduler
# que aún no están portados a Rust.
# Worker Celery eliminado — apalis corre dentro del proceso api_rust.

services:

  # ── Reverse proxy ────────────────────────────────────────────────────────────
  proxy:
    image: traefik:latest
    container_name: proxy
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --api.insecure=false
      - --api.dashboard=false
      - --providers.docker.network=proyectos-bi-quare
      - --accesslog=true
      - --log=true
      - --log.level=INFO
      - --certificatesresolvers.netlify.acme.email=${TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.netlify.acme.storage=/acme.json
      - --certificatesresolvers.netlify.acme.dnschallenge=true
      - --certificatesresolvers.netlify.acme.dnschallenge.provider=netlify
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ./.env
    environment:
      - NETLIFY_TOKEN=${NETLIFY_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./apps/proxy/acme.json:/acme.json
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.entrypoints=web"

  # ── Frontend apps ─────────────────────────────────────────────────────────────

  # Landing page estática — primera carga del dominio (priority 2 / fallback)
  home:
    container_name: home
    build:
      context: .
      dockerfile: ./apps/home/Dockerfile
    restart: always
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=proyectos-bi-quare
      - traefik.http.routers.home-http.rule=Host(`${PLANE_DOMAIN:-plane.codecsrayo.com}`)
      - traefik.http.routers.home-http.entrypoints=web
      - traefik.http.routers.home-http.middlewares=plane-https
      - traefik.http.routers.home.rule=Host(`${PLANE_DOMAIN:-plane.codecsrayo.com}`)
      - traefik.http.routers.home.entrypoints=websecure
      - traefik.http.routers.home.tls=true
      - traefik.http.routers.home.tls.certresolver=netlify
      - traefik.http.routers.home.priority=2
      - traefik.http.services.home.loadbalancer.server.port=8080

  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        DOCKER_BUILDKIT: 1
        VITE_API_BASE_URL: https://${PLANE_DOMAIN:-plane.codecsrayo.com}
        VITE_API_BASE_PATH: /api
        VITE_ADMIN_BASE_URL: https://${PLANE_DOMAIN:-plane.codecsrayo.com}
        VITE_ADMIN_BASE_PATH: /god-mode
        VITE_LIVE_BASE_URL: https://${PLANE_DOMAIN:-plane.codecsrayo.com}
        VITE_LIVE_BASE_PATH: /live
        VITE_SPACE_BASE_URL: https://${PLANE_DOMAIN:-plane.codecsrayo.com}
        VITE_SPACE_BASE_PATH: /spaces
        VITE_WEB_BASE_URL: https://${PLANE_DOMAIN:-plane.codecsrayo.com}
        VITE_WEB_BASE_PATH: /app
    restart: always
    networks:
      - default
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=proyectos-bi-quare
      - traefik.http.middlewares.plane-https.redirectscheme.scheme=https
      - traefik.http.middlewares.plane-strip.stripprefix.prefixes=/app
      - traefik.http.routers.plane-http.rule=Host(`${PLANE_DOMAIN:-plane.codecsrayo.com}`) && PathPrefix(`/app`)
      - traefik.http.routers.plane-http.entrypoints=web
      - traefik.http.routers.plane-http.middlewares=plane-https
      - traefik.http.routers.plane.rule=Host(`${PLANE_DOMAIN:-plane.codecsrayo.com}`) && PathPrefix(`/app`)
      - traefik.http.routers.plane.entrypoints=websecure
      - traefik.http.routers.plane.tls=true
      - traefik.http.routers.plane.tls.certresolver=netlify
      - traefik.http.routers.plane.middlewares=plane-strip
      - traefik.http.routers.plane.priority=100
      - traefik.http.services.plane.loadbalancer.server.port=3000
    depends_on:
      api:
        condition: service_healthy

  admin:
    container_name: admin
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
      args:
        DOCKER_BUILDKIT: 1
        VITE_API_BASE_URL: https://${PLANE_DOMAIN:-plane.codecsrayo.com}
        VITE_API_BASE_PATH: /api
        VITE_ADMIN_BASE_URL: https://${PLANE_DOMAIN:-plane.codecsrayo.com}
        VITE_ADMIN_BASE_PATH: /god-mode
        VITE_SPACE_BASE_URL: https://${PLANE_DOMAIN:-plane.codecsrayo.com}
        VITE_SPACE_BASE_PATH: /spaces
        VITE_LIVE_BASE_URL: https://${PLANE_DOMAIN:-plane.codecsrayo.com}
        VITE_LIVE_BASE_PATH: /live
        VITE_WEB_BASE_URL: https://${PLANE_DOMAIN:-plane.codecsrayo.com}
        VITE_WEB_BASE_PATH: /app
    restart: always
    networks:
      - default
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=proyectos-bi-quare
      - traefik.http.routers.plane-admin.rule=Host(`${PLANE_DOMAIN:-plane.codecsrayo.com}`) && PathPrefix(`/god-mode`)
      - traefik.http.routers.plane-admin.entrypoints=websecure
      - traefik.http.routers.plane-admin.tls=true
      - traefik.http.routers.plane-admin.tls.certresolver=netlify
      - traefik.http.routers.plane-admin.priority=100
      - traefik.http.services.plane-admin.loadbalancer.server.port=3000
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

  space:
    container_name: space
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
      args:
        DOCKER_BUILDKIT: 1
        VITE_API_BASE_URL: https://${PLANE_DOMAIN:-plane.codecsrayo.com}
        VITE_API_BASE_PATH: /api
        VITE_ADMIN_BASE_URL: https://${PLANE_DOMAIN:-plane.codecsrayo.com}
        VITE_ADMIN_BASE_PATH: /god-mode
        VITE_SPACE_BASE_URL: https://${PLANE_DOMAIN:-plane.codecsrayo.com}
        VITE_SPACE_BASE_PATH: /spaces
        VITE_LIVE_BASE_URL: https://${PLANE_DOMAIN:-plane.codecsrayo.com}
        VITE_LIVE_BASE_PATH: /live
        VITE_WEB_BASE_URL: https://${PLANE_DOMAIN:-plane.codecsrayo.com}
        VITE_WEB_BASE_PATH: /app
    restart: always
    networks:
      - default
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=proyectos-bi-quare
      - traefik.http.routers.plane-space.rule=Host(`${PLANE_DOMAIN:-plane.codecsrayo.com}`) && PathPrefix(`/spaces`)
      - traefik.http.routers.plane-space.entrypoints=websecure
      - traefik.http.routers.plane-space.tls=true
      - traefik.http.routers.plane-space.tls.certresolver=netlify
      - traefik.http.routers.plane-space.priority=100
      - traefik.http.services.plane-space.loadbalancer.server.port=3000
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

  # ── API — Rust (reemplaza Django) ─────────────────────────────────────────────
  # Puerto interno: 8000 (igual que Django — Traefik no cambia)
  # Workers Celery eliminados: apalis + cron.rs corren en el mismo proceso
  # Migraciones: Migrator::up se ejecuta en startup — no requiere servicio separado
  api:
    container_name: api
    build:
      context: .
      dockerfile: ./apps/api_rust/Dockerfile
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    env_file:
      - ./.env
    environment:
      # Conexión PostgreSQL
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: plane-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      # Redis
      REDIS_HOST: plane-redis
      REDIS_PORT: 6379
      # Servidor
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DEBUG: ${DEBUG:-0}
      SECRET_KEY: ${SECRET_KEY}
      # CORS — permite el frontend
      CORS_ORIGINS: https://${PLANE_DOMAIN:-plane.codecsrayo.com}
      COOKIE_DOMAIN: ${PLANE_DOMAIN:-plane.codecsrayo.com}
      # URLs del frontend (para redirecciones OAuth, emails, etc.)
      WEB_URL: https://${PLANE_DOMAIN:-plane.codecsrayo.com}
      APP_BASE_URL: https://${PLANE_DOMAIN:-plane.codecsrayo.com}
      SPACE_BASE_URL: https://${PLANE_DOMAIN:-plane.codecsrayo.com}/spaces
      ADMIN_BASE_URL: https://${PLANE_DOMAIN:-plane.codecsrayo.com}/god-mode
      # S3 / MinIO
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      # OAuth (opcional)
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # GitHub App (integraciones)
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_NAME: ${GITHUB_APP_NAME:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      # AI / LLM (opcional)
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      # Unsplash (opcional)
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      # Email — usado por cron stack_email_notification
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-0}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@plane.so}
      # Limpieza periódica
      HARD_DELETE_AFTER_DAYS: ${HARD_DELETE_AFTER_DAYS:-30}
      UNUPLOADED_ASSET_DELETE_DAYS: ${UNUPLOADED_ASSET_DELETE_DAYS:-7}
    networks:
      - default
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=proyectos-bi-quare
      # Mismas reglas que Django — Traefik transparente al cambio
      - traefik.http.routers.plane-api.rule=Host(`${PLANE_DOMAIN:-plane.codecsrayo.com}`) && (PathPrefix(`/api`) || PathPrefix(`/auth`) || PathPrefix(`/static`))
      - traefik.http.routers.plane-api.entrypoints=websecure
      - traefik.http.routers.plane-api.tls=true
      - traefik.http.routers.plane-api.tls.certresolver=netlify
      - traefik.http.routers.plane-api.priority=100
      - traefik.http.services.plane-api.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_started

  # ── Live — colaboración en tiempo real ────────────────────────────────────────
  live:
    container_name: plane-live
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    networks:
      - default
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=proyectos-bi-quare
      - traefik.http.routers.plane-live.rule=Host(`${PLANE_DOMAIN:-plane.codecsrayo.com}`) && PathPrefix(`/live`)
      - traefik.http.routers.plane-live.entrypoints=websecure
      - traefik.http.routers.plane-live.tls=true
      - traefik.http.routers.plane-live.tls.certresolver=netlify
      - traefik.http.routers.plane-live.priority=100
      - traefik.http.services.plane-live.loadbalancer.server.port=3000
    depends_on:
      api:
        condition: service_healthy

  # ── Infraestructura ───────────────────────────────────────────────────────────
  plane-db:
    container_name: plane-db
    image: postgres:15.7-alpine
    restart: always
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  plane-redis:
    container_name: plane-redis
    image: valkey/valkey:7.2.11-alpine
    restart: always
    volumes:
      - redisdata:/data

  plane-minio:
    container_name: plane-minio
    image: minio/minio
    restart: always
    networks:
      - default
      - traefik-public
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    labels:
      - traefik.enable=true
      - traefik.docker.network=proyectos-bi-quare
      - traefik.http.routers.plane-minio.rule=Host(`${PLANE_DOMAIN:-plane.codecsrayo.com}`) && PathPrefix(`/${AWS_S3_BUCKET_NAME:-uploads}`)
      - traefik.http.routers.plane-minio.entrypoints=websecure
      - traefik.http.routers.plane-minio.tls=true
      - traefik.http.routers.plane-minio.tls.certresolver=netlify
      - traefik.http.routers.plane-minio.priority=100
      - traefik.http.services.plane-minio.loadbalancer.server.port=9000

volumes:
  pgdata:
  redisdata:
  uploads:

networks:
  default:
    driver: bridge
  traefik-public:
    name: proyectos-bi-quare
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.99.0.0/24
          gateway: 172.99.0.1
