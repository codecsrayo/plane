version: "3"
dotenv: ['.env', 'apps/web/.env', 'apps/api_rust/.env']
# ============================================================
# Plane — Taskfile
# Convención: <namespace>:<action>[:<modificador>]
# Ejecutar `task` o `task help` para listar todas las tareas
# ============================================================

vars:
  COMPOSE_DEV: docker-compose-dev.yml
  COMPOSE_PROD: docker-compose.yml
  API_RUST_DIR: apps/api_rust
  MIGRATION_MANIFEST: apps/api_rust/migration/Cargo.toml

tasks:
  # ----------------------------------------------------------
  # Help
  # ----------------------------------------------------------
  default:
    desc: List available tasks
    cmds:
      - task --list

  help:
    desc: List available tasks
    cmds:
      - task --list

  # ----------------------------------------------------------
  # Internal helpers
  # ----------------------------------------------------------
  acme:create:
    desc: Ensure ACME certificate file exists with secure permissions
    internal: true
    cmds:
      - |
        if [ -d ./apps/proxy/acme.json ]; then
          rm -rf ./apps/proxy/acme.json
          touch ./apps/proxy/acme.json
        elif [ ! -f ./apps/proxy/acme.json ]; then
          touch ./apps/proxy/acme.json
        fi
      - chmod 600 ./apps/proxy/acme.json

  # ----------------------------------------------------------
  # Setup — bootstrap local development
  # ----------------------------------------------------------
  setup:
    desc: Bootstrap the local development environment
    deps: [acme:create]
    cmds:
      - task: setup:env
      - task: setup:secret
      - task: setup:rust
      - task: setup:deps
      - echo "Setup complete."
      - 'echo "Next step: task compose:up"'

  setup:env:
    desc: Create missing .env files from .env.example
    cmds:
      - |
        for path in . ./apps/web ./apps/api ./apps/space ./apps/admin ./apps/live; do
          if [ ! -f "$path/.env" ]; then
            cp "$path/.env.example" "$path/.env"
            echo "Created $path/.env"
          else
            echo "Skipped $path/.env (already exists)"
          fi
        done

  setup:secret:
    desc: Generate and persist Django SECRET_KEY for local dev
    cmds:
      - |
        if ! grep -q '^SECRET_KEY=' ./apps/api/.env; then
          SECRET_KEY="$(tr -dc 'a-z0-9' < /dev/urandom | head -c50)"
          echo "SECRET_KEY=\"$SECRET_KEY\"" >> ./apps/api/.env
          echo "Added SECRET_KEY to ./apps/api/.env"
        else
          echo "Skipped SECRET_KEY (already exists in ./apps/api/.env)"
        fi

  setup:rust:
    desc: Install and configure the local Rust toolchain for api_rust
    cmds:
      - |
        if ! command -v rustup >/dev/null 2>&1; then
          echo "Installing rustup..."
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
        fi
        . "$HOME/.cargo/env"
        rustup toolchain install stable --profile minimal --component rustfmt --component clippy
        rustup override set stable
        cargo --version
      - sudo apt update && sudo apt install -y pkg-config libssl-dev

  setup:deps:
    desc: Enable pnpm and install JavaScript dependencies
    cmds:
      - corepack enable pnpm
      - pnpm install

  # ----------------------------------------------------------
  # JavaScript / pnpm / turbo
  # ----------------------------------------------------------
  npm:install:
    desc: Install JS dependencies with pnpm
    cmds:
      - pnpm install

  npm:build:
    desc: Build all JS packages and applications
    cmds:
      - pnpm build

  npm:check:
    desc: Run all JS checks (format + lint + types)
    cmds:
      - pnpm check

  npm:lint:
    desc: Run JS lint checks
    cmds:
      - pnpm check:lint

  npm:types:
    desc: Run JS / TypeScript type checks
    cmds:
      - pnpm check:types

  npm:fix:
    desc: Auto-fix JS formatting and lint issues
    cmds:
      - pnpm fix

  # ----------------------------------------------------------
  # Rust — api_rust workspace
  # ----------------------------------------------------------
  rust:build:
    desc: Build the Rust API workspace
    cmds:
      - cd {{.API_RUST_DIR}} && cargo build

  rust:check:
    desc: Run cargo check on the Rust API workspace
    cmds:
      - cd {{.API_RUST_DIR}} && cargo check

  rust:clean:
    desc: Clean Rust build artifacts (api + migration)
    cmds:
      - cd {{.API_RUST_DIR}} && cargo clean
      - rm -rf {{.API_RUST_DIR}}/target
      - cd {{.API_RUST_DIR}}/migration && cargo clean
      - rm -rf {{.API_RUST_DIR}}/migration/target

  rust:clippy:
    desc: Run clippy (warnings shown, not fatal)
    cmds:
      - cd {{.API_RUST_DIR}} && cargo clippy --all-targets --all-features

  rust:clippy:strict:
    desc: Run clippy treating warnings as errors (-> clippy.log)
    cmds:
      - cd {{.API_RUST_DIR}} && cargo clippy --all-targets --all-features -- -D warnings > clippy.log 2>&1

  rust:lint:
    desc: Full Rust lint pass — clippy strict + rustfmt check
    cmds:
      - task: rust:clippy:strict
      - cd {{.API_RUST_DIR}} && cargo fmt --all -- --check

  # ── Rust watch (cargo-watch) ───────────────────────────────
  rust:watch:run:
    desc: Run the Rust API with cargo-watch
    cmds:
      - cd {{.API_RUST_DIR}} && cargo watch -x run

  rust:watch:clippy:
    desc: Run clippy on file changes
    cmds:
      - cd {{.API_RUST_DIR}} && cargo watch -x clippy

  rust:watch:test:
    desc: Run Rust tests on file changes
    cmds:
      - cd {{.API_RUST_DIR}} && cargo watch -x test

  # ── Rust migrations (SeaORM) ───────────────────────────────
  rust:migrations:
    desc: Run SeaORM migrations with CMD=<up|down|fresh|refresh|reset|status>
    vars:
      CMD: '{{default "status" .CMD}}'
    cmds:
      - cargo run --manifest-path {{.MIGRATION_MANIFEST}} --features migrate -- {{.CMD}}

  rust:migrations:up:
    desc: Apply all pending migrations
    cmds:
      - cargo run --manifest-path {{.MIGRATION_MANIFEST}} --features migrate -- up

  rust:migrations:down:
    desc: Revert the last migration
    cmds:
      - cargo run --manifest-path {{.MIGRATION_MANIFEST}} --features migrate -- down

  rust:migrations:status:
    desc: Show status of all migrations
    cmds:
      - cargo run --manifest-path {{.MIGRATION_MANIFEST}} --features migrate -- status

  rust:migrations:fresh:
    desc: Drop all tables and re-apply all migrations
    cmds:
      - cargo run --manifest-path {{.MIGRATION_MANIFEST}} --features migrate -- fresh

  rust:migrations:refresh:
    desc: Rollback all and re-apply all migrations
    cmds:
      - cargo run --manifest-path {{.MIGRATION_MANIFEST}} --features migrate -- refresh

  rust:migrations:reset:
    desc: Rollback all migrations
    cmds:
      - cargo run --manifest-path {{.MIGRATION_MANIFEST}} --features migrate -- reset

  rust:migrations:drop-db:
    desc: Drop and recreate the plane database (containerized postgres)
    cmds:
      - docker exec -it plane-codecsrayo-db psql -U plane -d postgres -c "DROP DATABASE plane WITH (FORCE);"
      - docker exec -it plane-codecsrayo-db psql -U plane -d postgres -c "CREATE DATABASE plane;"

  rust:migrations:validate:
    desc: Validate the schema against baseline (drop-db + up)
    cmds:
      - task: rust:migrations:drop-db
      - task: rust:migrations:up

  rust:stop-container:
    desc: Stop the Rust container
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} stop api
  rust:start-container:
    desc: Start the Rust container
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} start api

  # ----------------------------------------------------------
  # Docker Compose — development
  # ----------------------------------------------------------
  compose:config:
    desc: Validate dev Docker Compose configuration
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} config

  compose:up:
    desc: Start dev containers in detached mode
    deps: [acme:create]
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} up -d --build

  compose:up:watch:
    desc: Start key dev services with Compose watch enabled
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} up --watch web admin space live home

  compose:down:
    desc: Stop dev containers
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} down

  compose:restart:
    desc: Restart dev containers (down + up --build)
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} down
      - docker compose -f {{.COMPOSE_DEV}} up -d --build

  compose:rebuild:
    desc: Rebuild and restart dev containers without cache
    deps: [acme:create]
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} build --no-cache
      - docker compose -f {{.COMPOSE_DEV}} up -d

  compose:watch:
    desc: Watch and sync changes for selected dev services
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} watch web admin space live home

  compose:ps:
    desc: Show running dev containers
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} ps

  compose:logs:
    desc: Follow dev container logs (use SERVICE=<name> to filter)
    cmds:
      - |
        if [ -n "{{.SERVICE}}" ]; then
          docker compose -f {{.COMPOSE_DEV}} logs -f {{.SERVICE}}
        else
          docker compose -f {{.COMPOSE_DEV}} logs -f
        fi

  compose:logs:proxy:
    desc: Follow proxy logs (dev)
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} logs -f proxy

  compose:url:
    desc: Show dev application URLs
    cmds:
      - 'echo "App: https://${PLANE_DOMAIN:-plane.codecsrayo.com}"'
      - 'echo "Dashboard Proxy: http://localhost:8080"'

  compose:clean-volumes:
    desc: Recreate dev containers after removing Compose-managed volumes
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} down -v
      - docker volume ls -q --filter "label=com.docker.compose.project=plane" | xargs -r docker volume rm
      - docker compose -f {{.COMPOSE_DEV}} up -d --build

  compose:purge:
    desc: Purge ALL Docker containers, images, volumes and custom networks
    cmds:
      - |
        if [ -n "$(docker ps -q)" ]; then docker stop $(docker ps -q); fi
      - |
        if [ -n "$(docker ps -aq)" ]; then docker rm $(docker ps -aq); fi
      - |
        if [ -n "$(docker images -q)" ]; then docker rmi $(docker images -q); fi
      - |
        if [ -n "$(docker volume ls -q)" ]; then docker volume rm $(docker volume ls -q); fi
      - |
        nets=$(docker network ls --filter "type=custom" -q)
        if [ -n "$nets" ]; then docker network rm $nets; fi

  # ----------------------------------------------------------
  # Docker Compose — production
  # ----------------------------------------------------------
  prod:config:
    desc: Validate prod Docker Compose configuration
    cmds:
      - docker compose -f {{.COMPOSE_PROD}} config

  prod:up:
    desc: Start prod containers in detached mode
    deps: [acme:create]
    cmds:
      - docker compose -f {{.COMPOSE_PROD}} up -d --build

  prod:down:
    desc: Stop prod containers
    cmds:
      - docker compose -f {{.COMPOSE_PROD}} down

  prod:restart:
    desc: Restart prod containers
    cmds:
      - docker compose -f {{.COMPOSE_PROD}} down
      - docker compose -f {{.COMPOSE_PROD}} up -d --build

  prod:rebuild:
    desc: Rebuild and restart a specific prod service (requires SERVICE)
    deps: [acme:create]
    requires:
      vars: [SERVICE]
    cmds:
      - docker compose -f {{.COMPOSE_PROD}} up -d --build {{.SERVICE}}

  prod:rebuild:all:
    desc: Rebuild and restart all prod containers without cache
    deps: [acme:create]
    cmds:
      - cd {{.API_RUST_DIR}} && cargo generate-lockfile
      - docker compose -f {{.COMPOSE_PROD}} build --no-cache
      - docker compose -f {{.COMPOSE_PROD}} up -d

  prod:ps:
    desc: Show running prod containers
    cmds:
      - docker compose -f {{.COMPOSE_PROD}} ps

  prod:logs:
    desc: Follow prod container logs (use SERVICE=<name> to filter)
    cmds:
      - |
        if [ -n "{{.SERVICE}}" ]; then
          docker compose -f {{.COMPOSE_PROD}} logs -f {{.SERVICE}}
        else
          docker compose -f {{.COMPOSE_PROD}} logs -f
        fi

  prod:logs:proxy:
    desc: Follow proxy logs (prod)
    cmds:
      - docker compose -f {{.COMPOSE_PROD}} logs -f proxy

  prod:url:
    desc: Show prod application URLs
    cmds:
      - 'echo "App: https://${PLANE_DOMAIN:-plane.codecsrayo.com}"'

  # ----------------------------------------------------------
  # E2E — Playwright integration tests
  #
  # Las tareas e2e:* cargan ./.env.e2e (si existe) antes de ejecutar
  # Playwright. Variables soportadas por el harness:
  #
  #   API_BASE_URL          URL del backend bajo prueba.
  #                         default: http://localhost:8000
  #                         Ejemplo: https://plane.codecsrayo.com
  #   E2E_EMAIL             email para sign-in / sign-up del runner.
  #   E2E_PASSWORD          password del runner E2E.
  #   E2E_STORAGE_PATH      ruta del storageState de Playwright.
  #
  # Argumentos (CLI vars del Taskfile, todas opcionales):
  #   APP=web|admin|space    (default: web en e2e:headed/ui/debug/report/codegen)
  #   SPEC=auth.spec.ts      un spec o glob
  #   PROJECT=web-session    proyecto definido en playwright.config
  #   ARGS=--workers=1 ...   flags extra para playwright test
  #
  # Ejemplos:
  #   task e2e:env                          # crea .env.e2e desde el ejemplo
  #   task e2e:install                      # descarga browsers (no Nix)
  #   task e2e:web
  #   task e2e:web SPEC=auth.spec.ts
  #   task e2e:admin PROJECT=admin-session
  #   task e2e:web ARGS="--reporter=line --workers=1"
  # ----------------------------------------------------------
  e2e:env:
    desc: Create .env.e2e from .env.e2e.example (idempotente)
    cmds:
      - |
        if [ ! -f "{{.ROOT_DIR}}/.env.e2e" ]; then
          cp "{{.ROOT_DIR}}/.env.e2e.example" "{{.ROOT_DIR}}/.env.e2e"
          echo "Created .env.e2e — edit API_BASE_URL / E2E_EMAIL / E2E_PASSWORD"
        else
          echo "Skipped .env.e2e (already exists)"
        fi

  e2e:install:
    desc: Install Playwright browsers (chromium) and OS deps
    cmds:
      - pnpm exec playwright install --with-deps chromium

  e2e:run:
    desc: Run Playwright suite for APP (web|admin|space). Requires APP var.
    requires:
      vars: [APP]
    cmds:
      - |
        set -a
        [ -f "{{.ROOT_DIR}}/.env.e2e" ] && . "{{.ROOT_DIR}}/.env.e2e"
        set +a
        cd "{{.ROOT_DIR}}/apps/{{.APP}}" && pnpm exec playwright test {{if .PROJECT}}--project={{.PROJECT}}{{end}} {{.SPEC}} {{.ARGS}}

  e2e:web:
    desc: Run Playwright suite for the web app
    cmds:
      - task: e2e:run
        vars:
          APP: web
          SPEC: '{{.SPEC}}'
          PROJECT: '{{.PROJECT}}'
          ARGS: '{{.ARGS}}'

  e2e:admin:
    desc: Run Playwright suite for the admin app
    cmds:
      - task: e2e:run
        vars:
          APP: admin
          SPEC: '{{.SPEC}}'
          PROJECT: '{{.PROJECT}}'
          ARGS: '{{.ARGS}}'

  e2e:space:
    desc: Run Playwright suite for the space app
    cmds:
      - task: e2e:run
        vars:
          APP: space
          SPEC: '{{.SPEC}}'
          PROJECT: '{{.PROJECT}}'
          ARGS: '{{.ARGS}}'

  e2e:all:
    desc: Run Playwright suite across web, admin and space (genera log combinado)
    set: [pipefail]                       # crítico: para que `task ... | tee` propague el exit code
    vars:
      LOG_DIR: '{{.ROOT_DIR}}/logs/e2e'
      TS:
        sh: date +%Y%m%d-%H%M%S
      LOG_FILE: '{{.LOG_DIR}}/run-{{.TS}}.log'
    cmds:
      - mkdir -p {{.LOG_DIR}}
      - ln -sfn "{{.LOG_FILE}}" "{{.LOG_DIR}}/latest.log"
      - |
        {
          echo "============================================================"
          echo " E2E run started: $(date -Iseconds)"
          echo " API_BASE_URL:    ${API_BASE_URL:-<unset>}"
          echo " Log file:        {{.LOG_FILE}}"
          echo "============================================================"

          # Setup: si algo aquí falla, no tiene sentido correr los specs
          set -e
          echo; echo "── [setup] rust:stop-container ──"; task rust:stop-container
          echo; echo "── [setup] wait-api-stopped ──";    task wait-api-stopped
          echo; echo "── [setup] rust:migrations:drop-db ──"; task rust:migrations:drop-db
          echo; echo "── [setup] rust:start-container ──"; task rust:start-container
          echo; echo "── [setup] wait-api-healthy ──";   task wait-api-healthy
          set +e

          # Specs: corremos los 3 aunque alguno falle, para tener panorama completo
          rc=0
          for app in web admin space; do
            echo
            echo "============================================================"
            echo " RUN: e2e:$app — $(date -Iseconds)"
            echo "============================================================"
            if task "e2e:$app"; then
              echo "[OK] e2e:$app"
            else
              echo "[FAIL] e2e:$app (exit=$?)"
              rc=1
            fi
          done

          echo
          echo "============================================================"
          echo " E2E run finished: $(date -Iseconds) (exit=$rc)"
          echo " HTML reports:    apps/{web,admin,space}/playwright-report/index.html"
          echo " Raw log:         {{.LOG_FILE}}"
          echo "============================================================"
          exit $rc
        } 2>&1 | tee "{{.LOG_FILE}}"
      # Rotación: mantener solo los 20 runs más recientes
      - find {{.LOG_DIR}} -maxdepth 1 -name 'run-*.log' -type f | sort -r | tail -n +21 | xargs -r rm -f

  wait-api-stopped:
    internal: true
    cmds:
      - |
        echo "Esperando a que el contenedor se detenga..."
        timeout=60
        while [ "$(docker inspect -f '{{`{{.State.Running}}`}}' api 2>/dev/null)" = "true" ]; do
          [ $timeout -le 0 ] && echo "timeout esperando stop" && exit 1
          sleep 1; timeout=$((timeout-1))
        done

  wait-api-healthy:
      internal: true
      desc: Espera a que la API responda /api/health
      vars:
        CONTAINER: plane-codecsrayo-api
      cmds:
        - |
          : "${API_BASE_URL:?API_BASE_URL no está definida}"
          echo "Esperando API en $API_BASE_URL/api/health (timeout 10 min)..."
          timeout=600
          attempt=0
          until curl -fsS -o /dev/null --max-time 3 "$API_BASE_URL/api/health"; do
            attempt=$((attempt+1))
            if [ $timeout -le 0 ]; then
              echo "❌ timeout esperando /api/health"
              docker logs --tail 80 {{.CONTAINER}} 2>&1 || true
              exit 1
            fi
            if [ $((attempt % 15)) -eq 0 ]; then
              elapsed=$((600-timeout))
              status=$(docker inspect -f '{{`{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}`}}' {{.CONTAINER}} 2>/dev/null || echo "?")
              echo "  ...${elapsed}s — docker health: $status"
            fi
            sleep 2
            timeout=$((timeout-2))
          done
          echo "✅ API responde"


  e2e:headed:
    desc: Run Playwright in headed mode (APP=web by default)
    vars:
      APP: '{{default "web" .APP}}'
    cmds:
      - |
        set -a
        [ -f "{{.ROOT_DIR}}/.env.e2e" ] && . "{{.ROOT_DIR}}/.env.e2e"
        set +a
        cd "{{.ROOT_DIR}}/apps/{{.APP}}" && pnpm exec playwright test --headed {{.SPEC}}

  e2e:ui:
    desc: Open Playwright UI mode (APP=web by default)
    vars:
      APP: '{{default "web" .APP}}'
    cmds:
      - |
        set -a
        [ -f "{{.ROOT_DIR}}/.env.e2e" ] && . "{{.ROOT_DIR}}/.env.e2e"
        set +a
        cd "{{.ROOT_DIR}}/apps/{{.APP}}" && pnpm exec playwright test --ui

  e2e:debug:
    desc: Run Playwright in debug mode (APP=web by default)
    vars:
      APP: '{{default "web" .APP}}'
    cmds:
      - |
        set -a
        [ -f "{{.ROOT_DIR}}/.env.e2e" ] && . "{{.ROOT_DIR}}/.env.e2e"
        set +a
        cd "{{.ROOT_DIR}}/apps/{{.APP}}" && PWDEBUG=1 pnpm exec playwright test {{.SPEC}}

  e2e:report:
    desc: Open the last HTML report (APP=web by default)
    vars:
      APP: '{{default "web" .APP}}'
    cmds:
      - cd "{{.ROOT_DIR}}/apps/{{.APP}}" && pnpm exec playwright show-report playwright-report

  e2e:codegen:
    desc: Open Playwright codegen (APP=web, URL=https from .env.e2e or http://localhost:3000)
    vars:
      APP: '{{default "web" .APP}}'
      URL: '{{default "http://localhost:3000" .URL}}'
    cmds:
      - |
        set -a
        [ -f "{{.ROOT_DIR}}/.env.e2e" ] && . "{{.ROOT_DIR}}/.env.e2e"
        set +a
        cd "{{.ROOT_DIR}}/apps/{{.APP}}" && pnpm exec playwright codegen {{.URL}}

  # ----------------------------------------------------------
  # CI — automated deploy from cron
  # ----------------------------------------------------------
  ci:check:changes:
    desc: Fetch origin/o and exit 1 if there are no new commits (internal guard)
    internal: true
    cmds:
      - |
        set -euo pipefail
        git fetch origin o --quiet
        REMOTE_SHA=$(git rev-parse origin/o)
        LAST_SHA=""
        if [ -f .ci-last-sha ]; then
          LAST_SHA=$(cat .ci-last-sha)
        fi
        if [ "$REMOTE_SHA" = "$LAST_SHA" ]; then
          echo "[ci:check] No changes on branch o ($(echo "$REMOTE_SHA" | cut -c1-8)). Nothing to do."
          exit 1
        fi
        echo "[ci:check] Changes detected: ${LAST_SHA:-<first-run>} → $(echo "$REMOTE_SHA" | cut -c1-8)"

  ci:deploy:
    desc: |
      CI deploy — runs on cron; builds production only when branch o has new commits.
      Stores the last deployed SHA in .ci-last-sha (gitignored) to avoid redundant builds.
    deps: [acme:create]
    cmds:
      - |
        set -euo pipefail

        # ── 1. change detection ────────────────────────────────
        echo "[ci] Fetching origin/o..."
        git fetch origin o --quiet

        REMOTE_SHA=$(git rev-parse origin/o)
        LAST_SHA_FILE=".ci-last-sha"
        LAST_SHA=""

        if [ -f "$LAST_SHA_FILE" ]; then
          LAST_SHA=$(cat "$LAST_SHA_FILE")
        fi

        if [ "$REMOTE_SHA" = "$LAST_SHA" ]; then
          echo "[ci] No changes on branch o ($(echo "$REMOTE_SHA" | cut -c1-8)). Skipping build."
          exit 0
        fi

        echo "[ci] New commits: ${LAST_SHA:-<first-run>} → $(echo "$REMOTE_SHA" | cut -c1-8)"

        # ── 2. sync local branch ───────────────────────────────
        echo "[ci] Pulling branch o (fast-forward only)..."
        git pull origin o --ff-only

        # ── 3. lockfile ────────────────────────────────────────
        echo "[ci] Generating Cargo lockfile..."
        (cd {{.API_RUST_DIR}} && cargo generate-lockfile)

        # ── 4. build & deploy ──────────────────────────────────
        echo "[ci] Building production containers..."
        docker compose -f {{.COMPOSE_PROD}} build --no-cache

        echo "[ci] Starting containers..."
        docker compose -f {{.COMPOSE_PROD}} up -d

        # ── 5. record deployed SHA ────────────────────────────
        echo "$REMOTE_SHA" > "$LAST_SHA_FILE"
        echo "[ci] Deploy complete. SHA recorded: $(echo "$REMOTE_SHA" | cut -c1-8)"
