[package]
name = "api_rust"
version = "0.1.0"
edition = "2021"

# ── Workspace members ─────────────────────────────────────────────────────────
[workspace]
members = [".", "migration"]

# ── Dependencies — versiones fijadas para builds reproducibles ────────────────
# Actualizado: 2025-04-14
# Criterio: versión estable más reciente en crates.io al momento del pin.
# Para actualizar: `cargo update --precise <version>` o editar manualmente + CI.
[dependencies]

# Utilidades generales
anyhow       = "1.0.102"
async-trait  = "0.1.89"
thiserror    = "2.0.18"

# Async runtime
tokio = { version = "1.51.1", features = ["full"] }

# HTTP — servidor
axum       = { version = "0.8.9", features = ["macros", "multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
tower      = "0.5.3"
tower-http = { version = "0.6.8", features = ["cors", "trace", "compression-gzip"] }

# HTTP — cliente (no crear Client::new() por request)
reqwest = { version = "0.13.2", features = [
    "json",
    "form",
    "query",   # requerido en 0.13+ (ya no viene por defecto)
    "rustls",
    "gzip",
    "brotli",
], default-features = false }

# OpenAPI + Scalar UI
utoipa        = { version = "5.4.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }

# Base de datos — SeaORM + PostgreSQL
# Alineado con sea-orm-migration "1.1.20" declarado en migration/Cargo.toml
sea-orm = { version = "1.1.20", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-uuid",
    "with-chrono",
    "with-json",
] }

# Jobs / colas — apalis sobre Postgres (versión estable; RC descartada)
apalis     = { version = "0.7.4", features = ["limit", "timeout", "retry"] }
apalis-sql = { version = "0.7.4", features = ["postgres", "tokio-comp"] }

# Redis / Valkey
fred = { version = "10.1.0", features = ["i-std", "i-client", "subscriber-client"] }

# S3 / MinIO
aws-config  = "1.8.15"
aws-sdk-s3  = "1.129.0"

# Email
lettre = { version = "0.11.21", features = [
    "tokio1",
    "tokio1-native-tls",
    "smtp-transport",
    "builder",
] }

# Crypto / seguridad
openssl      = { version = "0.10.77", features = ["vendored"] }
sha2         = "0.11.0"    # hash de API keys — NUNCA almacenar raw token en memoria
jsonwebtoken = "10.3.0"    # JWT RS256 para GitHub App auth
aes-gcm      = "0.10.3"   # AES-256-GCM para cifrado de tokens OAuth en reposo (versión estable; RC descartada)

# Serialización
serde      = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono     = { version = "0.4.44", features = ["serde"] }
uuid       = { version = "1.23.0", features = ["v4", "serde"] }
time       = "0.3.47"    # Cookie::max_age en session logout
zxcvbn     = "3.1.0"

# Contenido / sanitización
ammonia    = "3.3.1"  # sanitización de HTML — previene XSS en description_html
base64     = "0.22.1" # encode/decode de cursores de paginación
dotenvy    = "0.15.7" # carga de .env en desarrollo
flate2     = "1.1.9"
urlencoding = "2.1.3" # encode de parámetros en URLs de reset password

# Observabilidad
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
serde_urlencoded = "0.7.1"
