[package]
name = "api_rust"
version = "0.1.0"
edition = "2021"

# ── Targets ───────────────────────────────────────────────────────────────────
# `lib` expone los módulos para los tests de integración (`tests/*.rs`).
# `bin` es el servidor productivo; reutiliza la lib vía `use api_rust::…`.
[lib]
name = "api_rust"
path = "src/lib.rs"

[[bin]]
name = "api_rust"
path = "src/main.rs"

# ── Workspace members ─────────────────────────────────────────────────────────
[workspace]
members = [".", "migration"]

# ── Dependencies — versiones fijadas para builds reproducibles ────────────────
# Actualizado: 2025-04-14
# Criterio: versión estable más reciente en crates.io al momento del pin.
# Para actualizar: `cargo update --precise <version>` o editar manualmente + CI.
[dependencies]

# Utilidades generales
anyhow       = "1.0.0"
async-trait  = "0.1.84"
thiserror    = "2.0.18"

# Async runtime
tokio = { version = "1.52.1", features = [
    "rt-multi-thread",  # runtime multi-hilo para #[tokio::main]
    "macros",           # #[tokio::main], #[tokio::test]
    "net",              # tokio::net (TcpListener en Axum)
    "time",             # tokio::time::sleep / interval
    "signal",           # graceful shutdown — SIGTERM/SIGINT
    "sync",             # Mutex, RwLock, broadcast, watch
] }

# HTTP — servidor
axum       = { version = "0.8.9", features = ["macros", "multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
tower      = { version = "0.5.3", features = ["make"] }
tower-http = { version = "0.6.8", features = ["cors", "trace", "compression-gzip", "normalize-path", "request-id"] }

# HTTP — cliente (no crear Client::new() por request)
reqwest = { version = "0.13.2", features = [
    "json",
    "form",
    "query",   # requerido en 0.13+ (ya no viene por defecto)
    "rustls",
    "gzip",
    "brotli",
], default-features = false }

# OpenAPI + Scalar UI
utoipa        = { version = "5.4.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }

# Base de datos — SeaORM + PostgreSQL
# Crate de migraciones SeaORM — ejecutado en startup via Migrator::up
migration = { path = "migration" }

# Alineado con sea-orm-migration "1.1.20" declarado en migration/Cargo.toml
sea-orm = { version = "1.1.20", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-uuid",
    "with-chrono",
    "with-json",
] }

# sqlx — requerido para PgPool en apalis_sql workers
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls"] }

# Jobs / colas — apalis sobre Postgres (versión estable; RC descartada)
apalis     = { version = "0.7.4", features = ["limit", "timeout", "retry"] }
apalis-sql = { version = "0.7.4", features = ["postgres", "tokio-comp"] }

# Redis / Valkey
fred = { version = "10.1.0", features = ["i-std", "i-client", "subscriber-client"] }

# S3 / MinIO
aws-config          = "1.8.15"
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
aws-sdk-s3          = "1.129.0"

# Email
# default-features = false es OBLIGATORIO: los defaults de lettre incluyen `native-tls`,
# lo que genera conflicto en compile-time con `tokio1` si `tokio1-native-tls` no está activo.
# Usamos rustls de forma consistente con reqwest / sea-orm / sqlx.
lettre = { version = "0.11.21", default-features = false, features = [
    "tokio1",
    "tokio1-rustls-tls",   # rustls TLS para SMTP — sin native-tls ni OpenSSL adicional
    "smtp-transport",
    "builder",
] }

# Crypto / seguridad
# "vendored" eliminado: fuerza compilar OpenSSL desde fuente (requiere Perl)
# y añade minutos al build. El sistema ya provee libssl-dev en todos los
# entornos (Docker + local). Para builds estáticos de distribución usar
# OPENSSL_STATIC=1 con la lib del sistema.
openssl      = { version = "0.10.77" }
sha2         = "0.11.0"    # hash de API keys — NUNCA almacenar raw token en memoria
jsonwebtoken = "10.3.0"    # JWT RS256 para GitHub App auth
aes-gcm      = "0.10.3"   # AES-256-GCM para cifrado de tokens OAuth en reposo
hmac-sha256  = "1.1.12"   # HMAC-SHA256 puro sin deps, para firma SigV4 presigned POST a S3

# Serialización
serde      = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono     = { version = "0.4.44", features = ["serde"] }
# IANA timezone database — paridad con `pytz` de Django (app/views/timezone/base.py).
# Requerido para calcular `utc_offset`/`gmt_offset` dinámicos respetando DST.
chrono-tz  = "0.10.4"
uuid       = { version = "1.23.1", features = ["v4", "serde"] }
time       = "0.3.47"    # Cookie::max_age en session logout
zxcvbn     = "3.1.1"

# Contenido / sanitización
ammonia = "4.1.2"  # sanitización de HTML — previene XSS en description_html
base64     = "0.22.1" # encode/decode de cursores de paginación
dotenvy    = "0.15.7" # carga de .env en desarrollo
flate2     = "1.1.9"
urlencoding = "2.1.3" # encode de parámetros en URLs de reset password
rand       = "0.10.1"     # random color generation (mirrors Django get_random_color)
regex      = "1.11.1" # html_to_text en email_notification

# Export de issues — paridad con apps/api/plane/bgtasks/export_task.py
# - `zip`: contenedor ZIP real (Django usa `zipfile.ZipFile`).
# - `rust_xlsxwriter`: emite .xlsx (Django usa `openpyxl`).
# - `csv`: escape RFC 4180 + sanitización de inyección CSV consistente con
#   `apps/api/plane/utils/csv_utils.py::sanitize_csv_value`.
zip             = { version = "8.6.0", default-features = false, features = ["deflate"] }
rust_xlsxwriter = "0.94"
csv             = "1.3"

# Observabilidad
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
serde_urlencoded = "0.7.1"


# ── Dev dependencies — tests de integración ───────────────────────────────────
# `proptest` es el framework canónico de tests basados en propiedades para el
# proyecto (ver `apps/api_rust/todo_test.md`). Se acompaña de:
#   - `tower`: para `ServiceExt::oneshot` — invoca el Router sin abrir socket.
#   - `http-body-util`: colecta el body completo de la respuesta axum.
#   - `hyper`/`http`: construcción de requests tipados.
#   - `testcontainers`/`testcontainers-modules`: levanta Postgres + Redis
#     reales por test-suite para paridad completa con producción.
#   - `tokio-test`: runtime controlado para tests async.
[dev-dependencies]
proptest             = "1.5"
tower                = { version = "0.5.3", features = ["util"] }
http-body-util       = "0.1"
hyper                = "1.9.0"
http                 = "1.4.0"
tokio-test           = "0.4"
testcontainers        = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres", "redis"] }
serial_test          = "3.2"
once_cell            = "1.20"
# Los tests reutilizan los mismos tipos del crate bajo prueba (uuid, chrono,
# base64, serde_json) pero éstos no quedan expuestos automáticamente a los
# integration tests — se declaran explícitamente aquí.
base64               = "0.22.1"
chrono               = { version = "0.4.44", features = ["serde"] }
uuid                 = { version = "1.23.1", features = ["v4", "serde"] }
serde_json           = "1.0.149"
serde_urlencoded     = "0.7.1"
