[package]
name = "api_rust"
version = "0.1.0"
edition = "2021"

# ── Workspace members ─────────────────────────────────────────────────────────
[workspace]
members = [".", "migration"]

# ── Runtime & HTTP ────────────────────────────────────────────────────────────
[dependencies]
anyhow = "1.0.102"
apalis = { version = "0.7.4", features = ["limit", "timeout", "retry"] }
apalis-sql = { version = "0.7.4", features = ["postgres", "tokio-comp"] }
async-trait = "0.1.89"
aws-config = "1.8.15"
aws-sdk-s3 = "1.129.0"
axum = { version = "0.8.8", features = ["macros", "multipart"] }
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15.7"
fred = { version = "10.1.0", features = [
    "i-std",
    "i-client",
    "subscriber-client",
] }
lettre = { version = "0.11.21", features = [
    "tokio1",
    "tokio1-native-tls",
    "smtp-transport",
    "builder",
] }
openssl = { version = "0.10.76", features = ["vendored"] }
sea-orm = { version = "1.1.20", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-uuid",
    "with-chrono",
    "with-json",
] }
sea-orm-migration = "1.1.20"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.51.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = [
    "cors",
    "trace",
    "compression-gzip",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "5.4.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
uuid = { version = "1.23.0", features = ["v4", "serde"] }
