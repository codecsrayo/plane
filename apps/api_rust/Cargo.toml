[package]
name = "api_rust"
version = "0.1.0"
edition = "2021"

# ── Workspace members ─────────────────────────────────────────────────────────
[workspace]
members = [".", "migration"]

# ── Dependencies — versiones resueltas por cargo ──────────────────────────────
[dependencies]

# Utilidades generales
anyhow = "*"
async-trait = "*"
thiserror = "*"

# Async runtime
tokio = { version = "*", features = ["full"] }

# HTTP — servidor
axum = { version = "*", features = ["macros", "multipart"] }
axum-extra = { version = "*", features = ["cookie", "typed-header"] }
tower = "*"
tower-http = { version = "*", features = ["cors", "trace", "compression-gzip"] }

# HTTP — cliente (no crear Client::new() por request)
reqwest = { version = "0.13.2", features = [
    "json",
    "rustls",
    "gzip",
    "brotli",
], default-features = false }

# OpenAPI + Scalar UI
utoipa = { version = "5.3.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-scalar = { version = "*", features = ["axum"] }

# Base de datos — SeaORM + PostgreSQL
sea-orm = { version = "*", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-uuid",
    "with-chrono",
    "with-json",
] }

# Jobs / colas — apalis sobre Postgres
apalis = { version = "*", features = ["limit", "timeout", "retry"] }
apalis-sql = { version = "*", features = ["postgres", "tokio-comp"] }

# Redis / Valkey
fred = { version = "*", features = ["i-std", "i-client", "subscriber-client"] }

# S3 / MinIO
aws-config = "*"


# Email
lettre = { version = "*", features = [
    "tokio1",
    "tokio1-native-tls",
    "smtp-transport",
    "builder",
] }

# Crypto / seguridad
openssl = { version = "*", features = ["vendored"] }
sha2 = "*"                                           # hash de API keys — NUNCA almacenar raw token en memoria
jsonwebtoken = "*"                                   # JWT RS256 para GitHub App auth

# Serialización
serde = { version = "*", features = ["derive"] }
serde_json = "*"
chrono = { version = "*", features = ["serde"] }
uuid = { version = "*", features = ["v4", "serde"] }
time = "*"                                           # Cookie::max_age en session logout
zxcvbn = "*"

# Contenido / sanitización
ammonia = "*" # sanitización de HTML — previene XSS en description_html
base64 = "*"  # encode/decode de cursores de paginación
dotenvy = "*" # carga de .env en desarrollo
flate2 = "*"

# Observabilidad
tracing = "*"
tracing-subscriber = { version = "*", features = ["env-filter", "json"] }
aws-sdk-s3 = "1.127.0"
