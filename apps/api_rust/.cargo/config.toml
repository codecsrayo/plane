# .cargo/config.toml — configuración de compilación para api_rust

# ─── Linker ───────────────────────────────────────────────────────────────────
# Rust 1.87+ inyecta rust-lld (bundled con rustup) automáticamente vía:
#   -B<sysroot>/.../bin/gcc-ld  -fuse-ld=lld
#
# NO se define [target.x86_64-unknown-linux-gnu] con -fuse-ld=mold porque:
#   1. mold no está disponible en todos los entornos (dev, CI, Docker slim).
#   2. Cuando la toolchain ya pasa -fuse-ld=lld, agregar -fuse-ld=mold
#      genera dos flags en conflicto → "collect2: fatal error: cannot find 'ld'".
#   3. rust-lld bundled ya es mucho más rápido que GNU ld sin dependencia extra.

# ─── Paralelismo ──────────────────────────────────────────────────────────────
# Cargo detecta los CPUs disponibles, pero ser explícito evita sorpresas
# con límites de CPU en Docker Desktop.
# Sobreescribible en host: CARGO_BUILD_JOBS=N docker compose up
[build]
jobs = 8

# ─── Perfil dev ───────────────────────────────────────────────────────────────
# opt-level = 0       → sin optimización (compilación más rápida)
# debug = 1           → debug info reducida — suficiente para backtrace,
#                       objetos más pequeños → link más rápido
# incremental         → reutiliza artefactos entre recompilaciones
# codegen-units = 256 → divide cada crate en 256 unidades LLVM para
#                       máximo paralelismo DENTRO de un crate
# split-debuginfo     → en Linux omite el paso serial dwp post-link
[profile.dev]
opt-level       = 0
debug           = 1
incremental     = true
codegen-units   = 256
split-debuginfo = "unpacked"

# ─── Deps en perfil dev ───────────────────────────────────────────────────────
# Dependencias compiladas una sola vez con opt-level=3.
# Runtime rápido sin penalizar la recompilación del código propio.
[profile.dev.package."*"]
opt-level = 3
debug     = false
