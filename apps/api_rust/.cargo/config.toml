# .cargo/config.toml — configuración de compilación para api_rust
#
# ─── Linker ───────────────────────────────────────────────────────────────────
# mold es 5-10× más rápido que ld en la fase de enlazado (linking).
# Solo aplica en Linux x86_64 (entorno Docker y WSL); en macOS Cargo usa lld
# de Apple automáticamente.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# ─── Perfil dev ───────────────────────────────────────────────────────────────
# opt-level = 0  → sin optimización (default, compilación más rápida)
# debug = 1      → info de debug reducida — suficiente para backtrace en dev,
#                  genera objetos más pequeños y linkea más rápido que debug=2
# incremental    → reutiliza artefactos entre recompilaciones parciales
[profile.dev]
opt-level   = 0
debug       = 1
incremental = true

# ─── Deps en perfil dev ───────────────────────────────────────────────────────
# Las dependencias se compilan una sola vez con opt-level=3 aunque el perfil
# dev del binario sea 0. Resultado: deps rápidas en runtime sin penalizar
# el tiempo de recompilación del código propio.
[profile.dev.package."*"]
opt-level = 3
debug     = false
