[package]
name = "migration"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "migration"
path = "src/main.rs"
required-features = ["migrate"]

[features]
migrate = []

[dependencies]
async-trait = "0.1.89"
dotenvy = "0.15.7"
sea-orm-migration = { version = "1.1.20", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
tokio = { version = "1.51.1", features = ["rt-multi-thread", "macros"] }
