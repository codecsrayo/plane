[package]
name = "migration"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
sea-orm-migration = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
async-trait       = { version = "0.1" }
tokio             = { version = "1", features = ["rt-multi-thread", "macros"] }
