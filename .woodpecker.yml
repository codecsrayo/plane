# Pipeline de prueba - Woodpecker CI
# Ejecuta un simple hello world para verificar que el agente funciona correctamente

steps:
  hello-world:
    # Imagen minimalista con shell disponible
    image: alpine
    commands:
      # Saludo basico
      - echo "Hello World desde Woodpecker CI!"
      # Info del entorno de ejecucion
      - echo "Rama: $CI_COMMIT_BRANCH"
      - echo "Commit: $CI_COMMIT_SHA"
      - echo "Repo: $CI_REPO"
