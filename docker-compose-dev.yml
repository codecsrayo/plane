services:
  proxy:
    image: traefik:latest
    container_name: proxy
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --api.insecure=false
      - --api.dashboard=false
      - --providers.docker.network=proyectos-bi-quare
      - --accesslog=true
      - --log=true
      - --log.level=DEBUG
      - --certificatesresolvers.netlify.acme.email=${TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.netlify.acme.storage=/acme.json
      - --certificatesresolvers.netlify.acme.dnschallenge=true
      - --certificatesresolvers.netlify.acme.dnschallenge.provider=netlify
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    env_file:
      - .env
    environment:
      - NETLIFY_TOKEN=${NETLIFY_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./apps/proxy/acme.json:/acme.json
    restart: unless-stopped
    networks:
      - traefik-public


  # ── Landing page (home) ───────────────────────────────────────────────────────
  # Primera carga del dominio: sirve apps/home (HTML estático) en la raíz "/".
  # Actúa como fallback (priority 2) — todas las rutas específicas (priority 100)
  # tienen prioridad mayor en Traefik.
  home:
    container_name: plane-codecsrayo-home
    build:
      context: .
      dockerfile: ./apps/home/Dockerfile
    restart: always
    networks:
      traefik-public:
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_PUBLIC_NETWORK:-proyectos-bi-quare}
      - traefik.http.routers.plane-codecsrayo-home-http.rule=Host(`${PLANE_DOMAIN:-plane.codecsrayo.com}`)
      - traefik.http.routers.plane-codecsrayo-home-http.entrypoints=web
      - traefik.http.routers.plane-codecsrayo-home-http.middlewares=plane-codecsrayo-https
      - traefik.http.routers.plane-codecsrayo-home.rule=Host(`${PLANE_DOMAIN:-plane.codecsrayo.com}`)
      - traefik.http.routers.plane-codecsrayo-home.entrypoints=websecure
      - traefik.http.routers.plane-codecsrayo-home.tls=true
      - traefik.http.routers.plane-codecsrayo-home.tls.certresolver=netlify
      - traefik.http.routers.plane-codecsrayo-home.priority=2
      - traefik.http.services.plane-codecsrayo-home.loadbalancer.server.port=8080
    develop:
      watch:
        - action: sync+restart
          path: ./apps/home
          target: /usr/share/nginx/html

  web:
    container_name: plane-codecsrayo-web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.dev
      args:
        VITE_API_BASE_URL: https://plane.codecsrayo.com
        VITE_API_BASE_PATH: /api
        VITE_ADMIN_BASE_URL: https://plane.codecsrayo.com
        VITE_ADMIN_BASE_PATH: /god-mode
        VITE_LIVE_BASE_URL: https://plane.codecsrayo.com
        VITE_LIVE_BASE_PATH: /live
        VITE_SPACE_BASE_URL: https://plane.codecsrayo.com
        VITE_SPACE_BASE_PATH: /spaces
        VITE_WEB_BASE_URL: https://plane.codecsrayo.com
        VITE_WEB_BASE_PATH: /app
    restart: always
    networks:
      default:
        aliases:
          - web
      traefik-public:
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_PUBLIC_NETWORK:-proyectos-bi-quare}
      - traefik.http.middlewares.plane-codecsrayo-https.redirectscheme.scheme=https
      - traefik.http.routers.plane-codecsrayo-http.rule=Host(`${PLANE_DOMAIN:-plane.codecsrayo.com}`) && PathPrefix(`/app`)
      - traefik.http.routers.plane-codecsrayo-http.entrypoints=web
      - traefik.http.routers.plane-codecsrayo-http.middlewares=plane-codecsrayo-https
      - traefik.http.routers.plane-codecsrayo.rule=Host(`${PLANE_DOMAIN:-plane.codecsrayo.com}`) && PathPrefix(`/app`)
      - traefik.http.routers.plane-codecsrayo.entrypoints=websecure
      - traefik.http.routers.plane-codecsrayo.tls=true
      - traefik.http.routers.plane-codecsrayo.tls.certresolver=netlify
      - traefik.http.routers.plane-codecsrayo.priority=100
      - traefik.http.services.plane-codecsrayo.loadbalancer.server.port=3000
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /app/apps/web
          initial_sync: true
          ignore:
            - node_modules/
            - build/
            - .turbo/
        - action: sync
          path: ./packages
          target: /app/packages
          initial_sync: true
          ignore:
            - "*/node_modules/"
            - "*/dist/"
            - "*/build/"
            - "*/.turbo/"
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./turbo.json
        - action: rebuild
          path: ./apps/web/package.json
    depends_on:
      api:
        condition: service_healthy

  admin:
    container_name: plane-codecsrayo-admin
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.dev
      args:
        VITE_API_BASE_URL: https://plane.codecsrayo.com
        VITE_API_BASE_PATH: /api
        VITE_ADMIN_BASE_URL: https://plane.codecsrayo.com
        VITE_ADMIN_BASE_PATH: /god-mode
        VITE_SPACE_BASE_URL: https://plane.codecsrayo.com
        VITE_SPACE_BASE_PATH: /spaces
        VITE_LIVE_BASE_URL: https://plane.codecsrayo.com
        VITE_LIVE_BASE_PATH: /live
        VITE_WEB_BASE_URL: https://plane.codecsrayo.com
        VITE_WEB_BASE_PATH: /app
    restart: always
    networks:
      default:
        aliases:
          - admin
      traefik-public:
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_PUBLIC_NETWORK:-proyectos-bi-quare}
      - traefik.http.routers.plane-codecsrayo-admin.rule=Host(`${PLANE_DOMAIN:-plane.codecsrayo.com}`) && PathPrefix(`/god-mode`)
      - traefik.http.routers.plane-codecsrayo-admin.entrypoints=websecure
      - traefik.http.routers.plane-codecsrayo-admin.tls=true
      - traefik.http.routers.plane-codecsrayo-admin.tls.certresolver=netlify
      - traefik.http.routers.plane-codecsrayo-admin.priority=100
      - traefik.http.services.plane-codecsrayo-admin.loadbalancer.server.port=3001
    develop:
      watch:
        - action: sync
          path: ./apps/admin
          target: /app/apps/admin
          initial_sync: true
          ignore:
            - node_modules/
            - build/
            - .turbo/
        - action: sync
          path: ./packages
          target: /app/packages
          initial_sync: true
          ignore:
            - "*/node_modules/"
            - "*/dist/"
            - "*/build/"
            - "*/.turbo/"
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./turbo.json
        - action: rebuild
          path: ./apps/admin/package.json
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

  space:
    container_name: plane-codecsrayo-space
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.dev
      args:
        VITE_API_BASE_URL: https://plane.codecsrayo.com
        VITE_API_BASE_PATH: /api
        VITE_ADMIN_BASE_URL: https://plane.codecsrayo.com
        VITE_ADMIN_BASE_PATH: /god-mode
        VITE_SPACE_BASE_URL: https://plane.codecsrayo.com
        VITE_SPACE_BASE_PATH: /spaces
        VITE_LIVE_BASE_URL: https://plane.codecsrayo.com
        VITE_LIVE_BASE_PATH: /live
        VITE_WEB_BASE_URL: https://plane.codecsrayo.com
        VITE_WEB_BASE_PATH: /app
    restart: always
    networks:
      default:
        aliases:
          - space
      traefik-public:
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_PUBLIC_NETWORK:-proyectos-bi-quare}
      - traefik.http.routers.plane-codecsrayo-space.rule=Host(`${PLANE_DOMAIN:-plane.codecsrayo.com}`) && PathPrefix(`/spaces`)
      - traefik.http.routers.plane-codecsrayo-space.entrypoints=websecure
      - traefik.http.routers.plane-codecsrayo-space.tls=true
      - traefik.http.routers.plane-codecsrayo-space.tls.certresolver=netlify
      - traefik.http.routers.plane-codecsrayo-space.priority=100
      - traefik.http.services.plane-codecsrayo-space.loadbalancer.server.port=3002
    develop:
      watch:
        - action: sync
          path: ./apps/space
          target: /app/apps/space
          initial_sync: true
          ignore:
            - node_modules/
            - build/
            - .turbo/
        - action: sync
          path: ./packages
          target: /app/packages
          initial_sync: true
          ignore:
            - "*/node_modules/"
            - "*/dist/"
            - "*/build/"
            - "*/.turbo/"
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./turbo.json
        - action: rebuild
          path: ./apps/space/package.json
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

  live:
    container_name: plane-codecsrayo-live
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.dev
    restart: always
    networks:
      default:
        aliases:
          - live
      traefik-public:
    env_file:
      - ./apps/live/.env
    environment:
      PORT: 3003
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_PUBLIC_NETWORK:-proyectos-bi-quare}
      - traefik.http.routers.plane-codecsrayo-live.rule=Host(`${PLANE_DOMAIN:-plane.codecsrayo.com}`) && PathPrefix(`/live`)
      - traefik.http.routers.plane-codecsrayo-live.entrypoints=websecure
      - traefik.http.routers.plane-codecsrayo-live.tls=true
      - traefik.http.routers.plane-codecsrayo-live.tls.certresolver=netlify
      - traefik.http.routers.plane-codecsrayo-live.priority=100
      - traefik.http.services.plane-codecsrayo-live.loadbalancer.server.port=3003
    develop:
      watch:
        - action: sync
          path: ./apps/live
          target: /app/apps/live
          initial_sync: true
          ignore:
            - node_modules/
            - dist/
            - build/
            - .turbo/
        - action: sync
          path: ./packages
          target: /app/packages
          initial_sync: true
          ignore:
            - "*/node_modules/"
            - "*/dist/"
            - "*/build/"
            - "*/.turbo/"
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./turbo.json
        - action: rebuild
          path: ./apps/live/package.json
    depends_on:
      api:
        condition: service_healthy

  plane-redis:
    container_name: plane-codecsrayo-redis
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    networks:
      default:
        aliases:
          - plane-redis
    volumes:
      - redisdata:/data

  plane-minio:
    container_name: plane-codecsrayo-minio
    image: minio/minio
    restart: unless-stopped
    networks:
      default:
        aliases:
          - plane-minio
      traefik-public:
    entrypoint: >
      /bin/sh -c "
      mkdir -p /export/${AWS_S3_BUCKET_NAME} &&
      minio server /export --console-address ':9090' &
      sleep 5 &&
      mc alias set myminio http://localhost:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY} &&
      mc mb myminio/${AWS_S3_BUCKET_NAME} -p || true
      && tail -f /dev/null
      "
    volumes:
      - uploads:/export
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_PUBLIC_NETWORK:-proyectos-bi-quare}
      - traefik.http.routers.plane-codecsrayo-minio.rule=Host(`${PLANE_DOMAIN:-plane.codecsrayo.com}`) && PathPrefix(`/${AWS_S3_BUCKET_NAME:-uploads}`)
      - traefik.http.routers.plane-codecsrayo-minio.entrypoints=websecure
      - traefik.http.routers.plane-codecsrayo-minio.tls=true
      - traefik.http.routers.plane-codecsrayo-minio.tls.certresolver=netlify
      - traefik.http.routers.plane-codecsrayo-minio.priority=100
      - traefik.http.services.plane-codecsrayo-minio.loadbalancer.server.port=9000

  plane-db:
    container_name: plane-codecsrayo-db
    image: postgres:15.7-alpine
    restart: unless-stopped
    networks:
      default:
        aliases:
          - plane-db
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    container_name: plane-codecsrayo-api
    build:
      context: .
      dockerfile: ./apps/api_rust/Dockerfile.dev
    restart: unless-stopped
    networks:
      default:
        aliases:
          - api
      traefik-public:
    volumes:
      - ./apps/api_rust:/app
      - rust_target:/app/target
      - cargo_registry:/usr/local/cargo/registry
    env_file:
      - ./apps/api/.env
    environment:
      DEBUG: "true"
      API_PORT: "8000"
      RUST_LOG: "debug,sea_orm=info,sqlx=warn"
      RUST_BACKTRACE: "1"
      CORS_ALLOWED_ORIGINS: https://${PLANE_DOMAIN:-plane.codecsrayo.com}
      WEB_URL: https://${PLANE_DOMAIN:-plane.codecsrayo.com}
      APP_BASE_URL: https://${PLANE_DOMAIN:-plane.codecsrayo.com}
      APP_BASE_PATH: /app
      ADMIN_BASE_URL: https://${PLANE_DOMAIN:-plane.codecsrayo.com}
      ADMIN_BASE_PATH: /god-mode
      SPACE_BASE_URL: https://${PLANE_DOMAIN:-plane.codecsrayo.com}
      SPACE_BASE_PATH: /spaces
      LIVE_BASE_URL: https://${PLANE_DOMAIN:-plane.codecsrayo.com}
      LIVE_BASE_PATH: /live
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_PUBLIC_NETWORK:-proyectos-bi-quare}
      - traefik.http.routers.plane-codecsrayo-api.rule=Host(`${PLANE_DOMAIN:-plane.codecsrayo.com}`) && (PathPrefix(`/api`) || PathPrefix(`/auth`) || PathPrefix(`/static`))
      - traefik.http.routers.plane-codecsrayo-api.entrypoints=websecure
      - traefik.http.routers.plane-codecsrayo-api.tls=true
      - traefik.http.routers.plane-codecsrayo-api.tls.certresolver=netlify
      - traefik.http.routers.plane-codecsrayo-api.priority=100
      - traefik.http.services.plane-codecsrayo-api.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_started

volumes:
  redisdata:
  uploads:
  pgdata:
  # Caché de compilación Rust — evita recompilar deps en cada reinicio del contenedor
  rust_target:
  cargo_registry:

networks:
  default:
    driver: bridge
  traefik-public:
    name: proyectos-bi-quare
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.99.0.0/24
          gateway: 172.99.0.1
