services:
  web:
    container_name: plane-codecsrayo-web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
        VITE_API_BASE_URL: https://plane.codecsrayo.com
        VITE_API_BASE_PATH: /api
        VITE_ADMIN_BASE_URL: https://plane.codecsrayo.com
        VITE_ADMIN_BASE_PATH: /god-mode
        VITE_LIVE_BASE_URL: https://plane.codecsrayo.com
        VITE_LIVE_BASE_PATH: /live
        VITE_SPACE_BASE_URL: https://plane.codecsrayo.com
        VITE_SPACE_BASE_PATH: /spaces
        VITE_WEB_BASE_URL: https://plane.codecsrayo.com
        VITE_WEB_BASE_PATH: ""
    restart: always
    networks:
      default:
        aliases:
          - web
    depends_on:
      - api

  admin:
    container_name: plane-codecsrayo-admin
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
        VITE_API_BASE_URL: https://plane.codecsrayo.com
        VITE_API_BASE_PATH: /api
        VITE_ADMIN_BASE_URL: https://plane.codecsrayo.com
        VITE_ADMIN_BASE_PATH: /god-mode
        VITE_SPACE_BASE_URL: https://plane.codecsrayo.com
        VITE_SPACE_BASE_PATH: /spaces
        VITE_LIVE_BASE_URL: https://plane.codecsrayo.com
        VITE_LIVE_BASE_PATH: /live
        VITE_WEB_BASE_URL: https://plane.codecsrayo.com
        VITE_WEB_BASE_PATH: ""
    restart: always
    networks:
      default:
        aliases:
          - admin
    depends_on:
      - api
      - web

  space:
    container_name: plane-codecsrayo-space
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
        VITE_API_BASE_URL: https://plane.codecsrayo.com
        VITE_API_BASE_PATH: /api
        VITE_ADMIN_BASE_URL: https://plane.codecsrayo.com
        VITE_ADMIN_BASE_PATH: /god-mode
        VITE_SPACE_BASE_URL: https://plane.codecsrayo.com
        VITE_SPACE_BASE_PATH: /spaces
        VITE_LIVE_BASE_URL: https://plane.codecsrayo.com
        VITE_LIVE_BASE_PATH: /live
        VITE_WEB_BASE_URL: https://plane.codecsrayo.com
        VITE_WEB_BASE_PATH: ""
    restart: always
    networks:
      default:
        aliases:
          - space
    depends_on:
      - api
      - web

  live:
    container_name: plane-codecsrayo-live
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    networks:
      default:
        aliases:
          - live
    env_file:
      - ./apps/live/.env
    depends_on:
      - api

  plane-redis:
    container_name: plane-codecsrayo-redis
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    networks:
      default:
        aliases:
          - plane-redis
    volumes:
      - redisdata:/data

  plane-mq:
    container_name: plane-codecsrayo-mq
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    networks:
      default:
        aliases:
          - plane-mq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}

  plane-minio:
    container_name: plane-codecsrayo-minio
    image: minio/minio
    restart: unless-stopped
    networks:
      default:
        aliases:
          - plane-minio
    entrypoint: >
      /bin/sh -c "
      mkdir -p /export/${AWS_S3_BUCKET_NAME} &&
      minio server /export --console-address ':9090' &
      sleep 5 &&
      mc alias set myminio http://localhost:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY} &&
      mc mb myminio/${AWS_S3_BUCKET_NAME} -p || true
      && tail -f /dev/null
      "
    volumes:
      - uploads:/export
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

  plane-db:
    container_name: plane-codecsrayo-db
    image: postgres:15.7-alpine
    restart: unless-stopped
    networks:
      default:
        aliases:
          - plane-db
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data

  api:
    container_name: plane-codecsrayo-api
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      default:
        aliases:
          - api
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-api-local.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq

  worker:
    container_name: plane-codecsrayo-worker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      default:
        aliases:
          - worker
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - plane-db
      - plane-redis

  beat-worker:
    container_name: plane-codecsrayo-beat-worker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      default:
        aliases:
          - beat-worker
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - plane-db
      - plane-redis

  migrator:
    container_name: plane-codecsrayo-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: "no"
    networks:
      default:
        aliases:
          - migrator
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-migrator.sh --settings=plane.settings.local
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis

  proxy:
    container_name: plane-codecsrayo-proxy
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.ce
    restart: always
    ports: !reset []
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      SITE_ADDRESS: :80
      TRUSTED_PROXIES: 0.0.0.0/0
    depends_on:
      - web
      - api
      - space
      - admin
      - live
    networks:
      - default
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=proyectos-bi-quare
      - traefik.http.routers.plane-codecsrayo-http.rule=Host(`plane.codecsrayo.com`)
      - traefik.http.routers.plane-codecsrayo-http.entrypoints=web
      - traefik.http.routers.plane-codecsrayo-http.middlewares=plane-codecsrayo-https
      - traefik.http.middlewares.plane-codecsrayo-https.redirectscheme.scheme=https
      - traefik.http.routers.plane-codecsrayo.rule=Host(`plane.codecsrayo.com`)
      - traefik.http.routers.plane-codecsrayo.entrypoints=websecure
      - traefik.http.routers.plane-codecsrayo.tls=true
      - traefik.http.routers.plane-codecsrayo.tls.certresolver=netlify
      - traefik.http.services.plane-codecsrayo.loadbalancer.server.port=80

volumes:
  redisdata:
  uploads:
  pgdata:
  rabbitmq_data:

networks:
  default:
    driver: bridge
  traefik-public:
    external: true
    name: proyectos-bi-quare
